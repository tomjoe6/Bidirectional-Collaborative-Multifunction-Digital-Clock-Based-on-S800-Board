<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">S800 Three-Party Architecture</title>
  <desc id="desc">A clean three-party architecture diagram with separated arrows for user actions, S800 board logic, PC host application, USB serial communication, and internet extensions.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .group { fill: #fffde7; stroke: #c7b84a; stroke-width: 1.8; rx: 4; }
      .user-group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.8; rx: 4; }
      .box { fill: #ece9ff; stroke: #8b7cf6; stroke-width: 1.6; rx: 3; }
      .net { fill: #eefaf0; stroke: #22a35a; stroke-width: 1.6; rx: 3; }
      .title { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .label { font: 700 15px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .small { font: 13px "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #333333; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .both { stroke: #333333; stroke-width: 1.7; fill: none; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 4; }
      .arrow-label { font: 12px "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820"/>

  <rect class="user-group" x="40" y="265" width="175" height="250"/>
  <text class="title" x="90" y="300">用户方</text>
  <rect class="box" x="70" y="330" width="115" height="52"/>
  <text class="label" x="105" y="360">用户</text>
  <text class="small" x="82" y="412">查看显示/状态</text>
  <text class="small" x="82" y="436">本地按键操作</text>
  <text class="small" x="82" y="460">PC端控制查询</text>

  <rect class="group" x="270" y="80" width="480" height="620"/>
  <text class="title" x="492" y="116">S800</text>

  <rect class="box" x="455" y="335" width="150" height="72"/>
  <text class="label" x="490" y="363">S800 主控</text>
  <text class="small" x="474" y="387">TM4C1294</text>

  <rect class="box" x="315" y="190" width="170" height="86"/>
  <text class="label" x="354" y="219">I2C &amp; GPIO</text>
  <text class="small" x="337" y="242">TCA6424/PCA9557</text>
  <text class="small" x="337" y="262">按键/LED/数码管驱动</text>

  <rect class="box" x="315" y="480" width="170" height="86"/>
  <text class="label" x="356" y="509">核心功能</text>
  <text class="small" x="337" y="532">时钟/闹钟/编辑</text>
  <text class="small" x="337" y="552">显示/蜂鸣/事件上报</text>

  <rect class="box" x="625" y="175" width="95" height="58"/>
  <text class="label" x="644" y="209">数码管</text>

  <rect class="box" x="625" y="285" width="95" height="58"/>
  <text class="label" x="649" y="319">LED</text>

  <rect class="box" x="625" y="395" width="95" height="58"/>
  <text class="label" x="646" y="429">蜂鸣器</text>

  <rect class="box" x="625" y="570" width="110" height="58"/>
  <text class="label" x="640" y="604">USB串口</text>

  <rect class="group" x="835" y="80" width="525" height="620"/>
  <text class="title" x="1074" y="116">PC 上位机</text>

  <rect class="box" x="875" y="570" width="135" height="58"/>
  <text class="label" x="906" y="604">串口通信</text>

  <rect class="box" x="1015" y="185" width="145" height="64"/>
  <text class="label" x="1060" y="213">PC</text>
  <text class="small" x="1038" y="235">PyQt5主窗口</text>

  <rect class="box" x="1190" y="180" width="130" height="58"/>
  <text class="label" x="1220" y="214">控制面板</text>

  <rect class="box" x="1190" y="320" width="130" height="72"/>
  <text class="label" x="1205" y="349">数字孪生</text>
  <text class="small" x="1205" y="371">数码管/LED/按键</text>

  <rect class="box" x="1190" y="475" width="130" height="58"/>
  <text class="label" x="1237" y="509">日志</text>

  <rect class="box" x="1010" y="475" width="150" height="78"/>
  <text class="label" x="1048" y="504">扩展模块</text>
  <text class="small" x="1030" y="527">NTP/天气/昼夜</text>
  <text class="small" x="1030" y="547">语音指令</text>

  <rect class="net" x="1015" y="735" width="180" height="50"/>
  <text class="label" x="1068" y="765">互联网</text>
  <text class="small" x="1047" y="783">NTP/天气API</text>

  <path class="arrow" d="M 185 356 L 315 233"/>
  <text class="arrow-label" x="222" y="272">本地按键</text>

  <path class="arrow" d="M 185 382 L 315 523"/>
  <text class="arrow-label" x="220" y="462">查看/使用</text>

  <path class="arrow dashed" d="M 185 356 L 185 40 L 1088 40 L 1088 185"/>
  <text class="arrow-label" x="535" y="32">PC端控制查询</text>

  <path class="arrow" d="M 485 233 L 530 233 L 530 335"/>
  <path class="arrow" d="M 485 523 L 530 523 L 530 407"/>
  <path class="arrow" d="M 605 356 L 625 204"/>
  <path class="arrow" d="M 605 371 L 625 314"/>
  <path class="arrow" d="M 605 386 L 625 424"/>
  <path class="both" d="M 605 398 L 680 570"/>

  <path class="both" d="M 735 599 L 875 599"/>
  <text class="arrow-label" x="764" y="584">USB虚拟串口</text>
  <text class="arrow-label" x="764" y="616">命令/事件/心跳</text>

  <path class="arrow" d="M 943 570 L 943 217 L 1015 217"/>
  <path class="arrow" d="M 1160 217 L 1190 209"/>
  <path class="arrow" d="M 1160 235 L 1190 340"/>
  <path class="arrow" d="M 1160 249 L 1190 504"/>
  <path class="arrow dashed" d="M 1010 599 L 1010 545"/>
  <path class="arrow" d="M 1085 475 L 1085 249"/>
  <path class="arrow" d="M 1085 553 L 1085 735"/>
  <text class="arrow-label" x="1098" y="648">网络请求</text>
</svg>
